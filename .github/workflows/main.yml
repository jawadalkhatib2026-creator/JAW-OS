name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jaw-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: jaw-system
      - run: gradle assembleRelease -Pvc=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: jaw-system-apk
          path: jaw-system/app/build/outputs/apk/release/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: Jaw System ${{ github.run_number }}
          files: jaw-system/app/build/outputs/apk/release/*.apk
